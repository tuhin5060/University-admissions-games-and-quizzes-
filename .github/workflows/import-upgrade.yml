name: Apply supplied v2 upgrade archive

on:
  push:
    branches:
      - import/v2
    paths:
      - ".upgrade-import/READY"

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Unpack supplied source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .upgrade-import/READY
          cat .upgrade-import/part-*.b64 | base64 --decode > "$RUNNER_TEMP/university-v2.tar.xz"
          mkdir -p "$RUNNER_TEMP/university-v2"
          xz --decompress --stdout "$RUNNER_TEMP/university-v2.tar.xz" | tar -xf - -C "$RUNNER_TEMP/university-v2"
          SOURCE="$RUNNER_TEMP/university-v2/University-Admissions-Games-Quizzes"
          test -f "$SOURCE/index.html"
          test -f "$SOURCE/package.json"
          test -f "$SOURCE/api/scores.js"
          test -f "$SOURCE/assets/img/cu-cover.webp"
          if find "$SOURCE" -type f \( -name ".env" -o -name ".env.local" \) | grep -q .; then
            echo "Refusing to import real environment files."
            exit 1
          fi
          if find "$SOURCE" -type d \( -name node_modules -o -name .vercel \) | grep -q .; then
            echo "Refusing to import dependency caches or local Vercel metadata."
            exit 1
          fi

      - name: Install and test the supplied version
        working-directory: ${{ runner.temp }}/university-v2/University-Admissions-Games-Quizzes
        run: |
          npm ci --no-audit --no-fund
          npm run check

      - name: Replace repository contents with the validated v2 source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --soft origin/main
          SOURCE="$RUNNER_TEMP/university-v2/University-Admissions-Games-Quizzes"
          rsync -a --delete --exclude='.git' "$SOURCE/" ./
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Upgrade admissions games and quizzes to v2"
          git push origin HEAD:main
